<script>
/* שכבת חשיפת שגיאות — נטענת ראשונה */
(function(){
  var errs=[];
  function show(msg){
    errs.push(msg);
    var b=document.getElementById('__errbar');
    if(!b){
      b=document.createElement('div');b.id='__errbar';
      b.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;background:#c62828;color:#fff;font:12px monospace;padding:8px;z-index:999999;direction:ltr;white-space:pre-wrap';
      var btn=document.createElement('button');btn.textContent='העתק הכל';
      btn.style.cssText='float:right;font-size:14px;padding:6px 10px';
      btn.onclick=function(e){e.stopPropagation();try{navigator.clipboard.writeText(errs.join('\n'))}catch(_){}};
      b.appendChild(btn);var pre=document.createElement('div');pre.id='__errtxt';b.appendChild(pre);
      (document.body||document.documentElement).appendChild(b);
    }
    document.getElementById('__errtxt').textContent=errs.join('\n');
  }
  window.addEventListener('error',function(e){show('[error] '+e.message+' @'+(e.lineno||'?')+':'+(e.colno||'?'))});
  window.addEventListener('unhandledrejection',function(e){show('[promise] '+(e.reason&&e.reason.message||e.reason))});
  window.__showErr=show;
})();
</script>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2b2140;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#stage{position:absolute;left:0;top:0;width:1000px;height:625px;transform-origin:0 0;overflow:hidden;background:#fff}
#scene{position:absolute;inset:0}
.layer{position:absolute;inset:0}
.thing{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab;transition:none}
.thing.walk{transition:left 1.6s ease-in-out, top 1.6s ease-in-out}
.thing .in{transition:transform .15s}
.thing.dragging .in{transform:scale(1.15) rotate(-4deg);filter:drop-shadow(0 12px 8px rgba(0,0,0,.25))}
.emo{line-height:1;text-align:center;display:block}
.flip{display:inline-block}
.an.jump{animation:jump .5s ease}
.an.wiggle{animation:wiggle .5s ease}
.an.spin{animation:spin .8s ease}
.an.shake{animation:shake .5s ease}
.an.bounce{animation:bounce .9s ease}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-34px) scale(1.04,.96)}70%{transform:translateY(0) scale(1.06,.94)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}20%{transform:translateY(-80px)}40%{transform:translateY(0)}60%{transform:translateY(-35px)}80%{transform:translateY(0)}}
.fx{position:absolute;transform:translate(-50%,-50%);pointer-events:none;animation:floatup 1.2s ease-out forwards;font-size:46px;z-index:99999}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.fall{position:absolute;pointer-events:none;animation:fall 1s ease-in forwards;z-index:99998}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(160px) rotate(200deg)}}
.drop{position:absolute;pointer-events:none;animation:rain .9s linear forwards;font-size:22px;z-index:99998}
@keyframes rain{0%{transform:translateY(0);opacity:1}100%{transform:translateY(330px);opacity:.2}}
.btn{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer;z-index:9000}
.btn:active{transform:translate(-50%,-46%) scale(.94)}
.tray{position:absolute;left:110px;right:110px;bottom:8px;height:78px;background:rgba(255,255,255,.82);border-radius:40px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:space-evenly;z-index:8000}
.slot{font-size:46px;width:62px;height:66px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.slot:active{transform:scale(1.15)}
.tile{position:absolute;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:100px;cursor:pointer;box-shadow:0 10px 0 rgba(0,0,0,.15),inset 0 -12px 0 rgba(0,0,0,.08);animation:bob 3s ease-in-out infinite}
.tile:active{transform:translate(-50%,-50%) scale(.93)}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-12px}}
.swatch{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2);cursor:pointer}
.eyes{animation:blink 4s infinite;transform-origin:60px 58px;transform-box:view-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tail{animation:wag .35s ease-in-out infinite alternate;transform-origin:30px 62px;transform-box:view-box}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.bub{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.15);pointer-events:none;animation:rise 4s linear forwards;z-index:30}
@keyframes rise{to{transform:translateY(-600px) translateX(20px);opacity:.2}}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes bobs{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.star{position:absolute;border-radius:50%;background:#fff;pointer-events:none;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.shoot{position:absolute;width:120px;height:3px;background:linear-gradient(90deg,#fff,transparent);pointer-events:none;transform:rotate(-25deg);animation:shoot 1.2s ease-out forwards}
@keyframes shoot{from{opacity:1;margin-left:0;margin-top:0}to{opacity:0;margin-left:-320px;margin-top:150px}}
.ans{position:absolute;top:495px;margin:-70px 0 0 -75px;width:150px;height:140px;border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:500;border:5px solid #fff}
.ans .num{font:bold 66px system-ui;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);line-height:1}
.ans .dots{display:grid;grid-template-columns:repeat(5,9px);gap:3px;margin-top:6px}
.ans .dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9}
.ans.right{animation:jump .6s;border-color:#ffd23f;box-shadow:0 0 0 8px #ffd23f}
.ans.nope{animation:shake .5s}
.ans.hint{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #fff}50%{box-shadow:0 0 0 12px rgba(255,255,255,.8)}}
.mo{display:none}.eat .mo{display:inline}.eat .ms{display:none}
.chew .mo{animation:chew .25s infinite alternate;transform-origin:60px 75px;transform-box:view-box}
@keyframes chew{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99990}
#rot{position:fixed;inset:0;background:#7b5cd6;display:none;align-items:center;justify-content:center;font-size:120px;z-index:100000}
#rot span{animation:rotp 2s ease-in-out infinite;display:inline-block}
@keyframes rotp{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.glow{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(255,240,170,.75),rgba(255,240,170,0) 70%)}

<body>
<div id="stage"><div id="scene"></div><div id="fade"></div></div>
<div id="rot"><span>📱</span></div>

<script>
/* ===== ליבה: במה, קנה מידה, גרירה ===== */
var W=1000,H=625,S=1;
var stage=document.getElementById('stage'), sceneEl=document.getElementById('scene');
var Z=100;
function fit(){
  var w=window.innerWidth,h=window.innerHeight;
  S=Math.min(w/W,h/H);
  stage.style.transform='scale('+S+')';
  stage.style.left=((w-W*S)/2)+'px';
  stage.style.top=((h-H*S)/2)+'px';
  document.getElementById('rot').style.display=(w<h && w<600)?'flex':'none';
}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,200)});
fit();
function toStage(e){var r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}
function srect(el){var r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  var l=(r.left-s.left)/S,t=(r.top-s.top)/S,R=(r.right-s.left)/S,B=(r.bottom-s.top)/S;
  return {l:l,t:t,r:R,b:B,cx:(l+R)/2,cy:(t+B)/2,w:R-l,h:B-t}}
function inR(p,rc,pad){pad=pad||0;return p.x>rc.l-pad&&p.x<rc.r+pad&&p.y>rc.t-pad&&p.y<rc.b+pad}
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function pos(el){return {x:parseFloat(el.style.left)||0,y:parseFloat(el.style.top)||0}}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

var drags={};
function startDrag(el,e,opts){
  if(e.cancelable)e.preventDefault();
  ac();
  var p=toStage(e),q=pos(el);
  el.classList.remove('walk');
  drags[e.pointerId]={el:el,opts:opts||{},dx:p.x-q.x,dy:p.y-q.y,sx:p.x,sy:p.y,moved:false,fresh:!!(opts&&opts.fresh)};
  el.classList.add('dragging');el.style.zIndex=++Z;el._dragging=true;
  if(opts&&opts.onStart)opts.onStart(el,p);
}
window.addEventListener('pointermove',function(e){
  var d=drags[e.pointerId];if(!d)return;
  var p=toStage(e);
  if(!d.moved&&dist(p,{x:d.sx,y:d.sy})>8)d.moved=true;
  var x=clamp(p.x-d.dx,10,W-10),y=clamp(p.y-d.dy,10,H-10);
  d.el.style.left=x+'px';d.el.style.top=y+'px';
  if(d.opts.onMove)d.opts.onMove(d.el,{x:x,y:y},p);
});
function endDrag(e){
  var d=drags[e.pointerId];if(!d)return;delete drags[e.pointerId];
  d.el.classList.remove('dragging');d.el._dragging=false;
  var p=pos(d.el);
  if(!d.moved&&!d.fresh){if(d.opts.onTap)d.opts.onTap(d.el,p);return}
  if(trayEl&&!d.opts.keep&&inR(p,srect(trayEl),-5)){poofRemove(d.el);return}
  if(d.opts.onDrop)d.opts.onDrop(d.el,p);
}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);

function thing(html,x,y,opts){
  opts=opts||{};
  var el=document.createElement('div');el.className='thing';
  el.innerHTML='<div class="in"><div class="an">'+html+'</div></div>';
  el.style.left=x+'px';el.style.top=y+'px';el.style.zIndex=opts.z||(++Z);
  if(!opts.fixed)el.addEventListener('pointerdown',function(e){startDrag(el,e,el._opts)});
  el._opts=opts;
  (opts.parent||sceneEl).appendChild(el);
  return el;
}
function anim(el,cls){var a=el.querySelector('.an');if(!a)return;a.classList.remove('jump','wiggle','spin','shake','bounce');void a.offsetWidth;a.classList.add(cls);setTimeout(function(){a.classList.remove(cls)},950)}
function fx(x,y,t,size){var d=document.createElement('div');d.className='fx';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';if(size)d.style.fontSize=size+'px';sceneEl.appendChild(d);setTimeout(function(){d.remove()},1250)}
function poofRemove(el){var p=pos(el);sfx.poof();fx(p.x,p.y,'💨');el.remove()}
function emo(t,size){return '<span class="emo" style="font-size:'+size+'px"><span class="flip">'+t+'</span></span>'}

/* כפתור */
function button(t,x,y,fn,size){var b=document.createElement('div');b.className='btn';b.innerHTML=t;b.style.left=x+'px';b.style.top=y+'px';if(size){b.style.width=b.style.height=size+'px';b.style.fontSize=(size*.55)+'px'}
  b.addEventListener('click',function(e){ac();fn(b,e)});sceneEl.appendChild(b);return b}

/* מגש פריטים */
var trayEl=null;
function tray(items,make){
  trayEl=document.createElement('div');trayEl.className='tray';
  items.forEach(function(it){
    var s=document.createElement('div');s.className='slot';s.innerHTML=it.icon||it;
    s.addEventListener('pointerdown',function(e){
      var p=toStage(e);var el=make(it,p.x,p.y-30);
      if(!el)return;sfx.pop();
      el._opts.fresh=true;startDrag(el,e,Object.assign({},el._opts,{fresh:true}));
      drags[e.pointerId].dx=0;drags[e.pointerId].dy=30;
    });
    trayEl.appendChild(s);
  });
  sceneEl.appendChild(trayEl);
}

/* טיימרים לכל סצנה */
var timers=[];
function every(f,ms){timers.push(setInterval(f,ms))}
function later(f,ms){timers.push(setTimeout(f,ms))}
</script>

<script>
/* ===== צלילים — נוצרים בקוד, בלי קבצים ===== */
var AC=null,master=null,last={};
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.6;master.connect(AC.destination)}catch(e){AC=null}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function tone(f,d,o){
  o=o||{};var a=ac();if(!a)return;var t=a.currentTime+(o.delay||0);
  var osc=a.createOscillator(),g=a.createGain();osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+d);
  if(o.vib){var l=a.createOscillator(),lg=a.createGain();l.frequency.value=o.vib;lg.gain.value=f*.06;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+d+.05)}
  var v=o.v||.25;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  var out=g;
  if(o.lp){var fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;g.connect(fl);out=fl}
  osc.connect(g);out.connect(master);osc.start(t);osc.stop(t+d+.05);
}
var NB=null;
function noise(d,o){
  o=o||{};var a=ac();if(!a)return;var t=a.currentTime+(o.delay||0);
  if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);var c=NB.getChannelData(0);for(var i=0;i<c.length;i++)c[i]=Math.random()*2-1}
  var s=a.createBufferSource();s.buffer=NB;var fl=a.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+d);fl.Q.value=o.q||1;
  var g=a.createGain(),v=o.v||.25;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05);
}
function once(k,ms){var n=Date.now();if(last[k]&&n-last[k]<ms)return false;last[k]=n;return true}
var NOTES=[523,587,659,698,784,880,988,1047];
var sfx={
  pop:function(){tone(500,.09,{to:1100})},
  click:function(){tone(1400,.03,{type:'square',v:.08})},
  boing:function(){tone(180,.4,{to:620,type:'triangle',vib:14})},
  chime:function(){[880,1109,1319].forEach(function(f,i){tone(f,.35,{delay:i*.07,type:'triangle',v:.15})})},
  sparkle:function(){for(var i=0;i<5;i++)tone(1200+Math.random()*1400,.15,{delay:i*.05,v:.08})},
  giggle:function(){[700,900,760,1040].forEach(function(f,i){tone(f,.09,{delay:i*.09,type:'triangle',v:.15,to:f*1.1})})},
  splash:function(){noise(.45,{f:900,to:300,v:.3});tone(320,.2,{to:120,v:.12})},
  munch:function(){for(var i=0;i<3;i++)noise(.07,{f:600,delay:i*.14,v:.3,q:2})},
  yum:function(){tone(500,.16,{to:700,type:'triangle'});tone(700,.22,{to:950,type:'triangle',delay:.16})},
  yuck:function(){tone(300,.5,{type:'sawtooth',to:140,vib:18,lp:900,v:.2})},
  snip:function(){noise(.05,{f:5000,type:'highpass',v:.2});tone(2200,.03,{v:.06,type:'square'})},
  spray:function(){noise(.18,{f:6000,type:'highpass',v:.12})},
  grow:function(){tone(300,.35,{to:900,v:.12})},
  poof:function(){noise(.3,{f:700,to:200,v:.25})},
  whoosh:function(){noise(.35,{f:400,to:2500,v:.2})},
  bubble:function(){var f=300+Math.random()*300;tone(f,.08,{to:f*2,v:.1})},
  fire:function(){noise(.4,{f:300,v:.2,type:'lowpass'})},
  rain:function(){noise(2.5,{f:3000,type:'highpass',v:.08})},
  camera:function(){noise(.06,{f:3000,v:.3});noise(.1,{f:1500,v:.2,delay:.08})},
  note:function(i){tone(NOTES[i%8],.45,{type:'triangle',v:.2})},
  tune:function(){[0,2,4,5,4,2,0].forEach(function(n,i){tone(NOTES[n],.22,{delay:i*.16,type:'triangle',v:.15})})},
  crack:function(){noise(.08,{f:2500,v:.3});noise(.08,{f:1800,v:.3,delay:.1})},
  pip:function(){tone(2200,.06,{to:2800,v:.12});tone(2300,.06,{to:2900,v:.12,delay:.12})},
  moo:function(){tone(150,1,{type:'sawtooth',to:105,lp:700,v:.3,vib:3})},
  baa:function(){tone(430,.75,{type:'sawtooth',vib:9,lp:1600,to:390,v:.18})},
  goat:function(){tone(560,.6,{type:'sawtooth',vib:11,lp:1800,to:520,v:.16})},
  oink:function(){tone(230,.13,{type:'square',lp:800,to:160,v:.22});tone(250,.13,{type:'square',lp:800,to:170,v:.22,delay:.18})},
  cluck:function(){[0,.1,.26].forEach(function(d){tone(950,.06,{type:'square',lp:2600,to:620,v:.15,delay:d})})},
  neigh:function(){tone(650,.85,{type:'sawtooth',vib:17,to:380,lp:2200,v:.15})},
  quack:function(){tone(520,.15,{type:'square',lp:1300,to:360,v:.2});tone(520,.15,{type:'square',lp:1300,to:360,v:.2,delay:.2})},
  meow:function(){tone(600,.25,{to:950,type:'triangle',v:.18});tone(950,.35,{to:500,type:'triangle',v:.18,delay:.25})},
  woof:function(){tone(190,.13,{type:'square',lp:700,to:120,v:.3});tone(200,.13,{type:'square',lp:700,to:125,v:.3,delay:.2})},
  squeak:function(){tone(1500,.1,{to:2100,v:.12})}
};
</script>

<script>
/* ===== דמויות מקוריות ===== */
var SKINS=['#ffdcc2','#f4c29b','#d9996b','#a8683f','#6e4329'];
var HAIRC=['#3b2314','#f2c14e','#b5562a','#151515','#ef6fa0','#7b5cd6','#3fb6c9'];
var HSTYLES=['short','long','curly','bun','pigtails','pony','wavy','curlylong','baby','bald'];
var COLORS=['#ff6b8b','#ffb347','#ffe066','#6cd07a','#4fb3ff','#9b7bff','#ffffff','#2d2d3a'];
function darker(c){var n=parseInt(c.slice(1),16),r=(n>>16)*.75,g=((n>>8)&255)*.75,b=(n&255)*.75;return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}
function partTop(st,col){
  var sl='<rect x="19" y="90" width="20" height="26" rx="9" fill="'+col+'"/><rect x="81" y="90" width="20" height="26" rx="9" fill="'+col+'"/>';
  if(st==='dress')return sl+'<path d="M36 90 Q60 83 84 90 L98 180 Q60 190 22 180 Z" fill="'+col+'"/><path d="M38 128 Q60 134 82 128" stroke="'+darker(col)+'" stroke-width="4" fill="none"/>';
  var t=sl+'<path d="M35 90 Q60 83 85 90 L87 152 L33 152 Z" fill="'+col+'"/>';
  if(st==='stripe')t+='<g stroke="#fff" stroke-width="5" opacity=".85"><path d="M34 106H86M34 122H86M34 138H86"/></g>';
  if(st==='hoodie')t+='<rect x="44" y="124" width="32" height="16" rx="6" fill="'+darker(col)+'"/><path d="M54 92 V108 M66 92 V108" stroke="#fff" stroke-width="3"/>';
  if(st==='star')t+='<path d="M60 104 L64 115 L75 115 L66 122 L70 133 L60 126 L50 133 L54 122 L45 115 L56 115Z" fill="#fff"/>';
  return t;
}
function partBottom(st,col){
  if(st==='skirt')return '<path d="M35 146 H85 L95 180 Q60 186 25 180 Z" fill="'+col+'"/>';

<script>
/* ===== עולם 8: כיתה — ספירה, חיבור וחיסור עד 20 ===== */
SCENES.school=function(){
  sceneEl.style.background='linear-gradient(#fff4dc,#ffe9bf 76%,#d9a066 76%)';
  var board=document.createElement('div');board.className='layer';board.style.cssText='left:150px;top:28px;width:700px;height:340px;background:#2f6b4f;border:14px solid #b07a3c;border-radius:18px;box-sizing:border-box;box-shadow:0 8px 0 rgba(0,0,0,.15)';sceneEl.appendChild(board);
  var ex=document.createElement('div');ex.style.cssText='position:absolute;left:0;right:0;top:14px;text-align:center;color:#fff;font:bold 84px "Chalkboard SE","Comic Sans MS",system-ui;direction:ltr;text-shadow:0 0 2px rgba(255,255,255,.5)';board.appendChild(ex);
  var objs=document.createElement('div');objs.style.cssText='position:absolute;left:20px;right:20px;top:128px;bottom:12px;display:flex;align-items:center;justify-content:center;gap:22px;direction:ltr';board.appendChild(objs);
  var chart=document.createElement('div');chart.className='layer';chart.style.cssText='left:870px;top:40px;width:115px;height:320px;background:#fff;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.15);display:flex;flex-wrap:wrap;align-content:flex-start;padding:8px;box-sizing:border-box;font-size:20px;line-height:1.15;overflow:hidden';sceneEl.appendChild(chart);
  function drawChart(){chart.textContent=new Array(Math.min(STARS%60||(STARS?60:0),60)+1).join('⭐');}
  drawChart();
  var owl=thing(emo('🦉',96),75,230,{fixed:true});owl.style.zIndex=50;
  owl.addEventListener('click',function(){ac();tone(400,.25,{to:330,type:'triangle'});tone(400,.3,{to:330,type:'triangle',delay:.3});anim(owl,'wiggle');setTimeout(read,500)});
  button('🔊',820,70,function(){read()},58);
  var kid=famChar(NAAMA,75,615,.75,{keep:true,fixed:false});
  var ITEMS=[['🍎','תַּפּוּחִים'],['🍓','תּוּתִים'],['⭐','כּוֹכָבִים'],['🐟','דָּגִים'],['🌸','פְּרָחִים'],['🎈','בָּלוֹנִים'],['🐞','חִפּוּשִׁיּוֹת'],['🚗','מְכוֹנִיּוֹת'],['🧁','עוּגִיּוֹת']];
  var lvl=1,inLvl=0,q=null,lock=false,wrong=0,btns=[];
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
  function gen(){
    var max=lvl===1?10:lvl===2?15:20,type=rnd(lvl===1?['count','count','add','add','sub']:['count','add','add','sub','sub']),it=rnd(ITEMS),it2=rnd(ITEMS.filter(function(x){return x!==it})),a,b,ans;
    var bmax=lvl===1?3:lvl===2?4:5;
    if(type==='count'){a=ri(lvl===1?2:lvl===2?5:8,max);ans=a}
    else if(type==='add'){a=ri(lvl===1?1:lvl===2?3:5,max-1);b=ri(1,Math.min(bmax,max-a));ans=a+b}
    else{a=ri(lvl===1?3:lvl===2?5:8,max);b=ri(1,Math.min(bmax,a-1));ans=a-b}
    return {type:type,a:a,b:b,ans:ans,it:it,it2:it2};
  }
  function grp(n,e,crossFrom){var g=document.createElement('div');g.style.cssText='display:grid;grid-template-columns:repeat('+Math.min(n,n>10?10:5)+',44px);gap:6px 4px;justify-content:center';
    if(n>5&&n<=10)g.style.gridTemplateColumns='repeat(5,44px)';
    for(var i=0;i<n;i++){var s=document.createElement('span');s.style.cssText='font-size:40px;line-height:44px;text-align:center;position:relative;transition:opacity .5s';s.textContent=e;
      if(crossFrom!=null&&i>=crossFrom){s.dataset.gone=1}
      if(n>10&&i%10===4)s.style.marginRight='10px';g.appendChild(s)}
    return g}
  function sign(t){var s=document.createElement('span');s.style.cssText='color:#fff;font:bold 60px system-ui';s.textContent=t;return s}
  function render(){
    objs.innerHTML='';
    if(q.type==='count'){ex.textContent=q.it[0]+' = ?';objs.appendChild(grp(q.a,q.it[0]))}
    else if(q.type==='add'){ex.textContent=q.a+' + '+q.b+' = ?';objs.appendChild(grp(q.a,q.it[0]));objs.appendChild(sign('+'));objs.appendChild(grp(q.b,q.it2[0]))}
    else{ex.textContent=q.a+' − '+q.b+' = ?';var g=grp(q.a,q.it[0],q.a-q.b);objs.appendChild(g);
      later(function(){g.querySelectorAll('[data-gone]').forEach(function(s){s.style.opacity=.25;var x=document.createElement('span');x.textContent='✖️';x.style.cssText='position:absolute;left:4px;top:2px;font-size:26px';s.appendChild(x)})},900)}
    // תשובות
    var ch=[q.ans],tries=0;while(ch.length<4&&tries<50){tries++;var d=q.ans+ri(-3,3);if(d>=0&&d<=20&&ch.indexOf(d)<0)ch.push(d)}
    ch.sort(function(x,y){return x-y});
    btns.forEach(function(b){b.remove()});btns=[];
    var colors=['#4fb3ff','#ff6b8b','#ffc83d','#6cd07a'];
    ch.forEach(function(n,i){
      var b=document.createElement('div');b.className='ans';b.style.left=(230+i*180)+'px';b.style.background=colors[i];
      var dots='';for(var k=0;k<n;k++)dots+='<i></i>';
      b.innerHTML='<div class="num">'+n+'</div><div class="dots">'+dots+'</div>';
      b.addEventListener('click',function(){answer(n,b)});
      sceneEl.appendChild(b);btns.push(b);
    });
  }
  function readText(){
    if(q.type==='count')return 'כַּמָּה '+q.it[1]+' יֵשׁ עַל הַלּוּחַ? בּוֹאִי נִסְפֹּר';
    if(q.type==='add')return HEB_NUM[q.a]+' וְעוֹד '+HEB_NUM[q.b]+'. כַּמָּה זֶה בְּיַחַד?';
    return HEB_NUM[q.a]+' פָּחוֹת '+HEB_NUM[q.b]+'. כַּמָּה נִשְׁאָר?';
  }
  function read(){if(q)say(readText())}
  function next(){q=gen();wrong=0;lock=false;render();later(read,350)}
  function answer(n,b){
    ac();if(lock)return;
    if(n===q.ans){
      lock=true;b.classList.add('right');sfx.chime();sfx.sparkle();say(rnd(['כָּל הַכָּבוֹד!','מְעֻלֶּה!','יֹפִי!','נָכוֹן מְאוֹד!','אַתְּ אַלּוּפָה!','וָואוּ, אֵיזוֹ חֲכָמָה!']));
      for(var i=0;i<7;i++)(function(i){later(function(){fx(250+Math.random()*500,120+Math.random()*200,rnd(['🎉','⭐','✨','🌟','🎊']),50)},i*90)})(i);
      STARS++;save();drawChart();anim(kid,'jump');
      inLvl++;if(inLvl>=6&&lvl<3){lvl++;inLvl=0}
      later(next,2000);
    }else{
      wrong++;b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');tone(320,.18,{type:'triangle',v:.12});say(rnd(['כִּמְעַט! בּוֹאִי נְנַסֶּה שׁוּב','לֹא נוֹרָא, נַסִּי עוֹד פַּעַם','בּוֹאִי נִסְפֹּר בְּיַחַד שׁוּב']));
      if(wrong>=2)btns.forEach(function(x){if(+x.querySelector('.num').textContent===q.ans)x.classList.add('hint')});
    }
  }
  next();
};
</script>

  var go_=button('▶️',90,560,function(){

    var rumble=setInterval(function(){noise(.25,{f:180,v:.12,type:'lowpass'})},230);timers.push(rumble);
    (function step(){var pt=P.getPointAtLength(d),sp=2.2+Math.max(0,(pt.y-110))*0.022;
      if(pt.y>lastY+0.6&&pt.y<300&&Date.now()-whee>1500){whee=Date.now();tone(900,1,{to:400,type:'triangle',v:.12});if(riders.length)say('ווּהוּ!')}
      lastY=pt.y;d+=sp;place(d);
      if(d<L-2&&sceneEl.contains(cart))requestAnimationFrame(step);else{clearInterval(rumble);running=false;cart.style.opacity=0;setTimeout(function(){place(d0);cart.style.transition='opacity .4s';cart.style.opacity=1;sfx.chime();setTimeout(function(){cart.style.transition=''},420)},500)}})();
  },80);
  // הוצאת רוכבים: נגיעה בכפתור
  button('⏏️',190,560,function(){if(running)return;riders.forEach(function(r,i){r.style.display='';r.style.left=(130+i*90)+'px';r.style.top=(r._isDog?520:470)+'px';anim(r,'jump')});riders=[];drawCart();sfx.pop()},64);
  function drop(e,p){if(running||riders.length>=3)return;var pt=P.getPointAtLength(d0);if(dist(p,{x:pt.x,y:pt.y-50})<110){e.style.display='none';riders.push(e);drawCart();sfx.pop();anim(cart.firstChild?e:e,'jump')}}
  [NAAMA,NOAM,MOM,DAD].forEach(function(id,i){famChar(id,330+i*110,610,.6,{onDrop:drop})});
  makeDog(800,575,.45,{onDrop:drop});
  later(function(){say('תּוֹשִׁיבִי אֶת כֻּלָּם בַּקָּרוֹן, וְאָז תִּלְחֲצִי עַל הַחֵץ')},500);
};

/* ---- מכוניות מתנגשות ---- */
SCENES.p_bumper=function(){
  sceneEl.style.background='#3a2d5c';
  var arena=document.createElement('div');arena.className='layer';arena.style.cssText='left:40px;top:90px;width:920px;height:500px;background:repeating-linear-gradient(45deg,#4c4c6a 0 30px,#55557a 30px 60px);border:14px solid #ffd23f;border-radius:40px;box-sizing:border-box;box-shadow:inset 0 0 0 8px #e74c3c';sceneEl.appendChild(arena);
  var X0=110,X1=890,Y0=160,Y1=520,RAD=55;
  var COL=['#ff6b8b','#4fb3ff','#9b7bff','#ffc83d'],IDS=[NAAMA,DAD,MOM,NOAM],cars=[];
  IDS.forEach(function(id,i){
    var html='<svg viewBox="0 0 120 120" width="120" height="120" style="display:block;overflow:visible"><path d="M60 -30 V10" stroke="#888" stroke-width="3"/><circle cx="60" cy="-32" r="5" fill="#ffd23f"/><ellipse cx="60" cy="78" rx="58" ry="38" fill="#222"/><ellipse cx="60" cy="72" rx="50" ry="32" fill="'+COL[i]+'"/><g transform="translate(30 0)">'+headSVG(id,60).replace('<svg ','<svg x="0" y="0" ')+'</g><rect x="22" y="70" width="76" height="16" rx="8" fill="#fff" opacity=".5"/></svg>';
    var c=thing(html,200+i*200,250+(i%2)*170,{
      onStart:function(e,p){e._hist=[[p.x,p.y,performance.now()]]},
      onMove:function(e,q,p){e._hist.push([q.x,q.y,performance.now()]);if(e._hist.length>5)e._hist.shift()},
      onTap:function(e){honk();var a=Math.random()*6.28;e._vx+=Math.cos(a)*6;e._vy+=Math.sin(a)*6},
      onDrop:function(e){var h=e._hist||[],a=h[0],b=h[h.length-1];if(a&&b&&b[2]>a[2]){var dt=(b[2]-a[2])/16;e._vx=clamp((b[0]-a[0])/dt,-14,14);e._vy=clamp((b[1]-a[1])/dt,-14,14)}}
    });
    c._vx=(Math.random()-.5)*4;c._vy=(Math.random()-.5)*4;cars.push(c);
  });
  function honk(){tone(420,.12,{type:'square',lp:1500,v:.15});tone(420,.12,{type:'square',lp:1500,v:.15,delay:.18})}
  every(function(){
    cars.forEach(function(c){if(c._dragging)return;var p=pos(c);
      if(Math.random()<.01){c._vx+=(Math.random()-.5)*5;c._vy+=(Math.random()-.5)*5}
      c._vx*=.99;c._vy*=.99;var sp=Math.hypot(c._vx,c._vy);if(sp<1.2&&sp>0){c._vx*=1.2/sp;c._vy*=1.2/sp}
      p.x+=c._vx;p.y+=c._vy;
      if(p.x<X0){p.x=X0;c._vx=Math.abs(c._vx);bump(c)}if(p.x>X1){p.x=X1;c._vx=-Math.abs(c._vx);bump(c)}
      if(p.y<Y0){p.y=Y0;c._vy=Math.abs(c._vy);bump(c)}if(p.y>Y1){p.y=Y1;c._vy=-Math.abs(c._vy);bump(c)}
      c.style.left=p.x+'px';c.style.top=p.y+'px';c.style.zIndex=Math.round(p.y);
    });
    for(var i=0;i<cars.length;i++)for(var j=i+1;j<cars.length;j++){var A=cars[i],B=cars[j],pa=pos(A),pb=pos(B),dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.hypot(dx,dy);
      if(d<RAD*2&&d>0){var nx=dx/d,ny=dy/d,va=A._vx*nx+A._vy*ny,vb=B._vx*nx+B._vy*ny,ov=(RAD*2-d)/2;
        if(!A._dragging){A.style.left=(pa.x-nx*ov)+'px';A.style.top=(pa.y-ny*ov)+'px'}if(!B._dragging){B.style.left=(pb.x+nx*ov)+'px';B.style.top=(pb.y+ny*ov)+'px'}
        if(va-vb>0){var dv=va-vb;A._vx-=dv*nx;A._vy-=dv*ny;B._vx+=dv*nx;B._vy+=dv*ny;
          if(once('bump'+i+j,400)){sfx.boing();fx((pa.x+pb.x)/2,(pa.y+pb.y)/2-40,rnd(['💥','⭐','😆']),44);anim(A,'shake');anim(B,'shake')}}}}
  },16);
  function bump(c){if(once('w'+cars.indexOf(c),300)){tone(200,.08,{type:'square',lp:600,v:.12})}}
  later(function(){say('תִּגְרְרִי מְכוֹנִית וְתַעִיפִי אוֹתָהּ! בּוּם!')},500);
};

/* ---- מרוץ מכוניות קל ---- */
SCENES.p_race=function(){
  sceneEl.style.background='linear-gradient(#9fdcff,#e2f6ff 28%,#7cc45f 28%)';
  var track=document.createElement('div');track.className='layer';track.style.cssText='top:200px;height:330px;background:#555;border-top:10px solid #fff;border-bottom:10px solid #fff';sceneEl.appendChild(track);
  [310,420].forEach(function(y){var l=document.createElement('div');l.className='layer';l.style.cssText='top:'+y+'px;height:6px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px)';sceneEl.appendChild(l)});
  var fin=document.createElement('div');fin.className='layer';fin.style.cssText='left:880px;width:36px;top:205px;height:325px;background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/18px 18px';sceneEl.appendChild(fin);
  var flags='';for(var i=0;i<12;i++)flags+=rnd(['🚩','🎏','🎉','👏']);
  var crowd=document.createElement('div');crowd.className='layer';crowd.style.cssText='top:120px;height:60px;font-size:40px;text-align:center;letter-spacing:12px;pointer-events:none';crowd.textContent=flags;sceneEl.appendChild(crowd);
  var START=90,END=880,LANES=[260,370,480],IDS=[DAD,MOM,NAAMA],COL=['#4fb3ff','#9b7bff','#ff6b8b'],cars=[];
  function carSVG(id,col){return '<svg viewBox="0 0 160 100" width="150" height="94" style="display:block;overflow:visible"><g transform="translate(52 -30)">'+headSVG(id,56).replace('<svg ','<svg x="0" y="0" ')+'</g><path d="M10 70 Q12 40 50 38 L110 38 Q150 42 152 70 Z" fill="'+col+'"/><rect x="6" y="62" width="150" height="20" rx="10" fill="'+col+'"/><circle cx="40" cy="84" r="14" fill="#222"/><circle cx="40" cy="84" r="6" fill="#ccc"/><circle cx="124" cy="84" r="14" fill="#222"/><circle cx="124" cy="84" r="6" fill="#ccc"/><circle cx="150" cy="66" r="5" fill="#ffe066"/></svg>'}
  IDS.forEach(function(id,i){var c=thing(carSVG(id,COL[i]),START,LANES[i],{fixed:true});c._x=START;c._v=0;cars.push(c)});
  var me=cars[2],gas=false,state='ready',light=null;
  var pedal=document.createElement('div');pedal.className='btn';pedal.style.cssText+='left:930px;top:575px;width:110px;height:84px;border-radius:24px;background:#6cd07a;font-size:52px';pedal.textContent='⏩';sceneEl.appendChild(pedal);
  pedal.addEventListener('pointerdown',function(e){ac();gas=true;if(state==='ready')start()});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){pedal.addEventListener(ev,function(){gas=false})});
  var lights=document.createElement('div');lights.className='layer';lights.style.cssText='left:440px;top:20px;width:120px;height:80px;font-size:56px;text-align:center;pointer-events:none';sceneEl.appendChild(lights);
  var again=null;
  function start(){state='count';var seq=[['🔴','שָׁלוֹשׁ'],['🟡','שְׁתַּיִם'],['🟢','אַחַת... סְעִי!']];
    seq.forEach(function(s,i){later(function(){lights.textContent=s[0];say(s[1]);tone(i<2?500:900,.25,{type:'square',lp:2000,v:.12});if(i===2){state='go';cars.forEach(function(c,j){c._v=0;c._target=j===2?0:.9+Math.random()*.5})}},i*900)});
  }
  every(function(){
    if(state!=='go')return;
    cars.forEach(function(c,i){
      if(c===me){c._v=gas?Math.min(4,c._v+.12):Math.max(0,c._v-.06)}else c._v=c._target;
      if(c._x<END)c._x+=c._v;
      c.style.left=c._x+'px';
      if(c._v>0&&once('eng'+i,200)&&c===me)tone(120+c._v*40,.18,{type:'sawtooth',lp:500,v:.06});
    });
    if(me._x>=END&&state==='go'){state='done';sfx.chime();sfx.sparkle();say('נִצַּחְתְּ! אֵיזוֹ אַלּוּפָה!');
      for(var i=0;i<12;i++)(function(i){later(function(){fx(300+Math.random()*500,150+Math.random()*300,rnd(['🎉','🎊','⭐','🏆']),56)},i*100)})(i);
      var cup=thing(emo('🏆',120),500,330,{fixed:true});cup.style.zIndex=999;anim(cup,'bounce');
      again=button('🔄',820,575,function(){cup.remove();again.remove();cars.forEach(function(c){c._x=START;c._v=0;c.style.left=START+'px'});lights.textContent='';state='ready';sfx.whoosh()},84);
    }
  },16);
  later(function(){say('תִּלְחֲצִי עַל הַכַּפְתּוֹר הַיָּרֹק, וְהַמְּכוֹנִית תִּסַּע מַהֵר!')},500);
};

/* ---- קליעה למטרה ---- */
SCENES.p_target=function(){
  sceneEl.style.background='repeating-linear-gradient(90deg,#ff6b8b 0 70px,#fff 70px 140px)';
  var wall=document.createElement('div');wall.className='layer';wall.style.cssText='left:120px;top:70px;width:760px;height:360px;background:#2b6cb0;border:14px solid #ffd23f;border-radius:20px;box-sizing:border-box';sceneEl.appendChild(wall);
  var counter=document.createElement('div');counter.className='layer';counter.style.cssText='top:470px;background:#8a5a2b;border-top:14px solid #b07a3c';sceneEl.appendChild(counter);
  var BC=['#ff4f5e','#ffc83d','#4fb3ff','#6cd07a','#ff8fd0','#9b7bff'],balloons=[],popped=0;
  function balloon(x,y){
    var col=rnd(BC),b=thing('<svg viewBox="0 0 60 100" width="60" height="100" style="display:block;overflow:visible"><path d="M30 70 Q24 85 32 100" stroke="#fff" stroke-width="2" fill="none"/><ellipse cx="30" cy="34" rx="26" ry="32" fill="'+col+'"/><path d="M26 66 L34 66 L30 72Z" fill="'+col+'"/><ellipse cx="20" cy="22" rx="6" ry="10" fill="#fff" opacity=".45"/></svg>',x,y,{fixed:true});
    b.querySelector('svg').style.animation='bobs '+(2.5+Math.random())+'s ease-in-out infinite';b._home={x:x,y:y};balloons.push(b);return b;
  }
  for(var r=0;r<3;r++)for(var c=0;c<6;c++)balloon(210+c*116,140+r*100);
  var ball=thing(emo('⚾',54),500,540,{fixed:true});ball.style.zIndex=900;
  var throwing=false;
  function throwAt(t){
    if(throwing)return;throwing=true;sfx.whoosh();
    var s={x:500,y:540},t0=performance.now(),T=420;
    (function step(){var u=Math.min(1,(performance.now()-t0)/T),x=s.x+(t.x-s.x)*u,y=s.y+(t.y-s.y)*u-Math.sin(u*Math.PI)*90;ball.style.left=x+'px';ball.style.top=y+'px';
      if(u<1)requestAnimationFrame(step);else{hit(t);setTimeout(function(){ball.style.left='500px';ball.style.top='540px';throwing=false},250)}})();
  }
  function hit(t){
    for(var i=0;i<balloons.length;i++){var b=balloons[i];if(b.style.visibility==='hidden')continue;var p=pos(b);if(Math.abs(p.x-t.x)<42&&Math.abs(p.y-t.y)<55){
      b.style.visibility='hidden';sfx.pop();noise(.12,{f:2000,v:.25});fx(p.x,p.y,'💥',56);popped++;
      if(popped%18===0){prize()}
      (function(b){later(function(){b.style.visibility='';var a=b.querySelector('ellipse');if(a)a.setAttribute('fill',rnd(BC))},2500)})(b);return}}
    sfx.click();
  }
  function prize(){sfx.chime();say('יֵשׁ! זָכִית בִּפְרָס!');var p=thing(emo(rnd(['🧸','🦄','🐻','🐼','🐶']),130),500,300,{});p.style.zIndex=1000;anim(p,'bounce');for(var i=0;i<8;i++)fx(300+Math.random()*400,200+Math.random()*200,rnd(['🎉','⭐','✨']),48)}
  wall.addEventListener('click',function(e){ac();throwAt(toStage(e))});
  balloons.forEach(function(b){b.addEventListener('click',function(e){ac();e.stopPropagation();throwAt(pos(b))})});
  famChar(NAAMA,120,615,.65);famChar(NOAM,880,615,.65);
  later(function(){say('תִּלְחֲצִי עַל בָּלוֹן, וְהַכַּדּוּר יָעוּף אֵלָיו!')},500);
};
