(function(){
  var errs=[];
  function show(msg){
    errs.push(msg);
    var b=document.getElementById('__errbar');
    if(!b){
      b=document.createElement('div');b.id='__errbar';
      b.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;background:#c62828;color:#fff;font:12px monospace;padding:8px;z-index:999999;direction:ltr;white-space:pre-wrap';
      var btn=document.createElement('button');btn.textContent='העתק הכל';
      btn.style.cssText='float:right;font-size:14px;padding:6px 10px';
      btn.onclick=function(e){e.stopPropagation();try{navigator.clipboard.writeText(errs.join('\n'))}catch(_){}};
      b.appendChild(btn);var pre=document.createElement('div');pre.id='__errtxt';b.appendChild(pre);
      (document.body||document.documentElement).appendChild(b);
    }
    document.getElementById('__errtxt').textContent=errs.join('\n');
  }
  window.addEventListener('error',function(e){show('[error] '+e.message+' @'+(e.lineno||'?')+':'+(e.colno||'?'))});
  window.addEventListener('unhandledrejection',function(e){show('[promise] '+(e.reason&&e.reason.message||e.reason))});
  window.__showErr=show;
})();
</script>

<body>
<div id="stage"><div id="scene"></div><div id="fade"></div></div>
<div id="rot"><span>📱</span></div>

<script>
/* ===== ליבה: במה, קנה מידה, גרירה ===== */
var W=1000,H=625,S=1;
var stage=document.getElementById('stage'), sceneEl=document.getElementById('scene');
var Z=100;
function fit(){
  var w=window.innerWidth,h=window.innerHeight;
  S=Math.min(w/W,h/H);
  stage.style.transform='scale('+S+')';
  stage.style.left=((w-W*S)/2)+'px';
  stage.style.top=((h-H*S)/2)+'px';
  document.getElementById('rot').style.display=(w<h && w<600)?'flex':'none';
}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,200)});
fit();
function toStage(e){var r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}
function srect(el){var r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  var l=(r.left-s.left)/S,t=(r.top-s.top)/S,R=(r.right-s.left)/S,B=(r.bottom-s.top)/S;
  return {l:l,t:t,r:R,b:B,cx:(l+R)/2,cy:(t+B)/2,w:R-l,h:B-t}}
function inR(p,rc,pad){pad=pad||0;return p.x>rc.l-pad&&p.x<rc.r+pad&&p.y>rc.t-pad&&p.y<rc.b+pad}
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function pos(el){return {x:parseFloat(el.style.left)||0,y:parseFloat(el.style.top)||0}}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

var drags={};
function startDrag(el,e,opts){
  if(e.cancelable)e.preventDefault();
  ac();
  var p=toStage(e),q=pos(el);
  el.classList.remove('walk');
  drags[e.pointerId]={el:el,opts:opts||{},dx:p.x-q.x,dy:p.y-q.y,sx:p.x,sy:p.y,moved:false,fresh:!!(opts&&opts.fresh)};
  el.classList.add('dragging');el.style.zIndex=++Z;el._dragging=true;
  if(opts&&opts.onStart)opts.onStart(el,p);
}
window.addEventListener('pointermove',function(e){
  var d=drags[e.pointerId];if(!d)return;
  var p=toStage(e);
  if(!d.moved&&dist(p,{x:d.sx,y:d.sy})>8)d.moved=true;
  var x=clamp(p.x-d.dx,10,W-10),y=clamp(p.y-d.dy,10,H-10);
  d.el.style.left=x+'px';d.el.style.top=y+'px';
  if(d.opts.onMove)d.opts.onMove(d.el,{x:x,y:y},p);
});
function endDrag(e){
  var d=drags[e.pointerId];if(!d)return;delete drags[e.pointerId];
  d.el.classList.remove('dragging');d.el._dragging=false;
  var p=pos(d.el);
  if(!d.moved&&!d.fresh){if(d.opts.onTap)d.opts.onTap(d.el,p);return}
  if(trayEl&&!d.opts.keep&&inR(p,srect(trayEl),-5)){poofRemove(d.el);return}
  if(d.opts.onDrop)d.opts.onDrop(d.el,p);
}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);

function thing(html,x,y,opts){
  opts=opts||{};
  var el=document.createElement('div');el.className='thing';
  el.innerHTML='<div class="in"><div class="an">'+html+'</div></div>';
  el.style.left=x+'px';el.style.top=y+'px';el.style.zIndex=opts.z||(++Z);
  if(!opts.fixed)el.addEventListener('pointerdown',function(e){startDrag(el,e,el._opts)});
  el._opts=opts;
  (opts.parent||sceneEl).appendChild(el);
  return el;
}
function anim(el,cls){var a=el.querySelector('.an');if(!a)return;a.classList.remove('jump','wiggle','spin','shake','bounce');void a.offsetWidth;a.classList.add(cls);setTimeout(function(){a.classList.remove(cls)},950)}
function fx(x,y,t,size){var d=document.createElement('div');d.className='fx';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';if(size)d.style.fontSize=size+'px';sceneEl.appendChild(d);setTimeout(function(){d.remove()},1250)}
function poofRemove(el){var p=pos(el);sfx.poof();fx(p.x,p.y,'💨');el.remove()}
function emo(t,size){return '<span class="emo" style="font-size:'+size+'px"><span class="flip">'+t+'</span></span>'}

/* כפתור */
function button(t,x,y,fn,size){var b=document.createElement('div');b.className='btn';b.innerHTML=t;b.style.left=x+'px';b.style.top=y+'px';if(size){b.style.width=b.style.height=size+'px';b.style.fontSize=(size*.55)+'px'}
  b.addEventListener('click',function(e){ac();fn(b,e)});sceneEl.appendChild(b);return b}

/* מגש פריטים */
var trayEl=null;
function tray(items,make){
  trayEl=document.createElement('div');trayEl.className='tray';
  items.forEach(function(it){
    var s=document.createElement('div');s.className='slot';s.innerHTML=it.icon||it;
    s.addEventListener('pointerdown',function(e){
      var p=toStage(e);var el=make(it,p.x,p.y-30);
      if(!el)return;sfx.pop();
      el._opts.fresh=true;startDrag(el,e,Object.assign({},el._opts,{fresh:true}));
      drags[e.pointerId].dx=0;drags[e.pointerId].dy=30;
    });
    trayEl.appendChild(s);
  });
  sceneEl.appendChild(trayEl);
}

/* טיימרים לכל סצנה */
var timers=[];
function every(f,ms){timers.push(setInterval(f,ms))}
function later(f,ms){timers.push(setTimeout(f,ms))}
</script>

<script>
/* ===== צלילים — נוצרים בקוד, בלי קבצים ===== */
var AC=null,master=null,last={};
/* מצב קול: 0 הכול פועל, 1 בלי קריינות, 2 שקט מלא */
var SOUND=0;try{SOUND=+(localStorage.getItem('myworld_sound')||(localStorage.getItem('myworld_muted')==='1'?2:0))||0}catch(e){}
var MUTED=SOUND===2;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=MUTED?0:.6;master.connect(AC.destination);musicInit()}catch(e){AC=null}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function tone(f,d,o){
  o=o||{};var a=ac();if(!a)return;var t=a.currentTime+(o.delay||0);
  var osc=a.createOscillator(),g=a.createGain();osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+d);
  if(o.vib){var l=a.createOscillator(),lg=a.createGain();l.frequency.value=o.vib;lg.gain.value=f*.06;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+d+.05)}
  var v=o.v||.25;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  var out=g;
  if(o.lp){var fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;g.connect(fl);out=fl}
  osc.connect(g);out.connect(master);osc.start(t);osc.stop(t+d+.05);
}
var NB=null;
function noise(d,o){
  o=o||{};var a=ac();if(!a)return;var t=a.currentTime+(o.delay||0);
  if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);var c=NB.getChannelData(0);for(var i=0;i<c.length;i++)c[i]=Math.random()*2-1}
  var s=a.createBufferSource();s.buffer=NB;var fl=a.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+d);fl.Q.value=o.q||1;
  var g=a.createGain(),v=o.v||.25;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05);
}
function once(k,ms){var n=Date.now();if(last[k]&&n-last[k]<ms)return false;last[k]=n;return true}
var NOTES=[523,587,659,698,784,880,988,1047];
var sfx={
  pop:function(){tone(500,.09,{to:1100})},
  click:function(){tone(1400,.03,{type:'square',v:.08})},
  boing:function(){tone(180,.4,{to:620,type:'triangle',vib:14})},
  chime:function(){[880,1109,1319].forEach(function(f,i){tone(f,.35,{delay:i*.07,type:'triangle',v:.15})})},
  sparkle:function(){for(var i=0;i<5;i++)tone(1200+Math.random()*1400,.15,{delay:i*.05,v:.08})},
  giggle:function(){[700,900,760,1040].forEach(function(f,i){tone(f,.09,{delay:i*.09,type:'triangle',v:.15,to:f*1.1})})},
  splash:function(){noise(.45,{f:900,to:300,v:.3});tone(320,.2,{to:120,v:.12})},
  munch:function(){for(var i=0;i<3;i++)noise(.07,{f:600,delay:i*.14,v:.3,q:2})},
  yum:function(){tone(500,.16,{to:700,type:'triangle'});tone(700,.22,{to:950,type:'triangle',delay:.16})},
  yuck:function(){tone(300,.5,{type:'sawtooth',to:140,vib:18,lp:900,v:.2})},

<script>

function pickVoice(){try{
  var v=window.speechSynthesis.getVoices().filter(function(x){return /^(he|iw)/i.test(x.lang)});
  function score(x){var n=x.name.toLowerCase(),sc=0;
    if(/asaf|אסף|avri|אברי/.test(n))sc-=100;
    if(/carmit|כרמית|hila|הילה/.test(n))sc+=20;
    if(/natural|neural|premium|enhanced|משופר/.test(n))sc+=15;
    if(/google/.test(n))sc+=5;
    return sc}
  v.sort(function(a,b){return score(b)-score(a)});HEV=v[0]||null}catch(e){}}
try{if('speechSynthesis' in window){pickVoice();window.speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
var sayTimer=null;
function say(t){try{
  if(SOUND>0||!('speechSynthesis' in window))return;
  var S=window.speechSynthesis;if(!HEV)pickVoice();
  clearTimeout(sayTimer);
  var busy=S.speaking||S.pending;S.cancel();

    u.onstart=function(){duck(true)};u.onend=u.onerror=function(){duck(false)};S.speak(u);

}catch(e){}}
/* הוראה של המסך הנוכחי — נאמרת בכניסה ואפשר לשמוע שוב בכפתור 💬 */
var CUR_TIP='',REPEAT=null;
function tip(t,delay){CUR_TIP=t;later(function(){say(t)},delay==null?900:delay)}
/* דמות מרחפת */
function bob(el,delay){var s=el.querySelector('svg');if(s){s.style.animation='bobs 3s ease-in-out infinite';s.style.animationDelay=(delay||0)+'s'}return el}

function dropObj(o,el,p){
  var d=PL[CUR_PLACE];
  // מחיקה בסל למטה (רק חפצים)
  if(o.k==='it'&&trayEl&&inR(p,srect(trayEl),-5)){delete WORLD.objs[o.id];wsave();poofRemove(el);return}
  // יציאה: דלת / מדרגות / חץ
  var ex=exitAt(p);
  if(ex){
    if(o.k==='car'&&!(PL[ex.to]&&PL[ex.to].street)){backTo(o,el);sfx.click();return}
    if(ex.to.charAt(0)==='!'){backTo(o,el);openGo(ex,ex.el);return}
    clearState(o);o.place=ex.to;
    if(ex.edge){o.x=ex.edge==='left'?880:120;o.y=o.k==='car'?560:clamp(p.y,200,520)}
    else{o.x=ex.sx||500;o.y=o.k==='p'?footY(o,ex.sy||520):(ex.sy||480)-(o.k==='dog'?30:20)}
    wsave();sfx.whoosh();go('pl_'+ex.to);return;
  }
  clearState(o);
  // אוכל לפה של דמות / סול
  if(o.k==='it'&&isFood(o.t)){
    for(var id in ELS){var t=ELS[id],q=t._o;if(!t.isConnected||!q||q===o||(q.k!=='p'&&q.k!=='dog'))continue;
      if(dist(p,t.mouth())<75){delete WORLD.objs[o.id];wsave();t.feed(el);orderCheck(q,o.t,t);return}}
  }
  // עלייה למכונית
  if(o.k==='p'||o.k==='dog'){for(var cid in ELS){var ce=ELS[cid],cq=ce._o;if(ce.isConnected&&cq&&cq.k==='car'&&dist(p,pos(ce))<85){cq.pass=cq.pass||[];if(cq.pass.length>=3)break;o.place='car:'+cq.id;cq.pass.push(o.id);el.remove();delete ELS[o.id];ce.querySelector('.an').innerHTML=carSVG(cq);anim(ce,'jump');wsave();sfx.pop();return}}}
  // אזורים מיוחדים: מיטה, אמבטיה, נדנדה, כיסא...

  for(var i=0;i<fs.length;i++){var f=fs[i];if(inR(p,f.r,12)&&(!f.accept||f.accept(o))){f.drop(o,el,p);applyState(o,el);el.style.zIndex=f.z||Math.round(o.y)+100;wsave();return}}
  var q2=pos(el);o.x=Math.round(q2.x);o.y=Math.round(q2.y);el.style.zIndex=Math.round(o.y)+(o.k==='it'?0:100);applyState(o,el);wsave();
}
